<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add to Cart</title>
    <link rel="stylesheet" href="css/AddToCard.css">
</head>

<body>
    <header>
        <h1>Product Details</h1>
        <a href="Products.html">Back to Products</a>
    </header>

    <section class="product-details">
        <img id="product-image" src="" alt="Product Image">
        <div class="details">
            <h2 id="product-name"></h2>
            <p id="product-description"></p>
            <div class="rating" id="product-rating">⭐⭐⭐⭐⭐</div>
            <p class="price" id="product-price"></p>
            <label for="quantity">Quantity:</label>
            <input type="number" id="quantity" value="1" min="1">
            <div class="buttons">
                <a href="#billing-form"><button id="add-to-cart" class="btn">Buy Now</button></a>
                <button id="remove-from-cart" class="btn" style="display:none;">Remove</button>
            </div>
        </div>
    </section>

    <section class="billing-details">
        <h2>Billing Details</h2>
        <form id="billing-form">
            <label for="customer-name">Full Name:</label>
            <input type="text" id="customer-name" placeholder="Enter your name" required>

            <label for="customer-email">Email:</label>
            <input type="email" id="customer-email" placeholder="Enter your email" required>

            <label for="customer-phone">Phone No:</label>
            <input type="text" id="customer-phone" placeholder="Enter your phone" required>

            <label for="customer-address">Address:</label>
            <textarea id="customer-address" placeholder="Enter your address" required></textarea>

            <h3>Select Payment Method:</h3>
            <select id="payment-method">
                <option value="COD">Cash On Delivery</option>
                <option value="UPI">UPI</option>
            </select>

            <div id="upi-qrcode-container" style="display:none;">
                <h3>Scan to Pay via UPI</h3>
                <div id="upi-qrcode"></div>
            </div>

            <button type="submit" class="btn" id="place-order">Place Order</button>
        </form>
    </section>

    <div id="order-confirmation-popup" class="popup-container">
        <div class="popup">
            <div class="thank-you-message">Your Order is Successfully Placed...</div>
            <div class="checkmark animate">
                <span>&#10003;</span>
            </div>
            <button id="close-popup" class="redirect-button">OK</button>
        </div>
    </div>

    <script src="js/AddToCard.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</body>

</html>
